        <h1>Toussaint Louverture, la comédie musicale</h1>
        <p>Le destin retrouvé d'un prince esclave est une comédie musicale moderne. Un hommage vivant. Une histoire qui résonne. À la croisée de l'art et de l'Histoire, ce spectacle puissant donne vie à un destin hors du commun à travers une création contemporaine mêlant musique, émotion et narration. Une expérience immersive qui touche, éclaire et inspire, un moment de scène où la mémoire devient énergie, et où le passé dialogue avec notre présent.</p>
        <p>Spectacle en cours de création. Soutenir le projet : <a href="https://www.helloasso.com/associations/dsibels/collectes/toussaint-louverture-showcase">campagne HelloAsso</a>.</p>
        <p>Partenaires : association D-Sibel, Happy Shows, FDVA, Fondation pour la Mémoire de l'Esclavage.</p>
